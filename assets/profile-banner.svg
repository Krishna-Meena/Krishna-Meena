<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Krishna Meena — Data, intelligence, impact.</title>
<desc id="desc">GenAI, machine learning and analytics portfolio. Abstract connected data nodes on a midnight navy background.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1226"/><stop offset="1" stop-color="#161334"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7c8cbd" stroke-opacity=".08"/></pattern>
</defs><style>
.orbit{transform-origin:1050px 200px;animation:spin 35s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}
</style>
<rect width="1200" height="410" rx="24" fill="url(#bg)"/>
<rect width="1200" height="410" rx="24" fill="url(#grid)"/>
<circle cx="1050" cy="200" r="155" fill="#8b5cf6" opacity=".06"/>
<circle class="orbit" stroke-dasharray="90 16 8 16" cx="1050" cy="200" r="116" fill="none" stroke="#8b5cf6" stroke-opacity=".3"/>
<circle cx="1050" cy="200" r="80" fill="none" stroke="#38bdf8" stroke-opacity=".22"/>
<g stroke="#67e8f9" stroke-opacity=".28" stroke-width="1.5">
<path d="M870 100L1010 80L1115 130L1050 205L1150 285L1000 320L925 255L870 100L1050 205L1010 80M925 255L1050 205L1000 320M1115 130L1150 285M1010 80L925 255"/>
</g>
<g class="pulse" fill="#5eead4"><circle cx="870" cy="100" r="5"/><circle cx="1050" cy="205" r="10"/><circle cx="1000" cy="320" r="5"/></g>
<g fill="#a78bfa"><circle cx="1010" cy="80" r="6"/><circle cx="1150" cy="285" r="7"/></g>
<g fill="#38bdf8"><circle cx="1115" cy="130" r="5"/><circle cx="925" cy="255" r="7"/></g>
<rect x="48" y="52" width="5" height="24" rx="2" fill="#5eead4"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="67" y="70" fill="#a9b9d8" font-size="15" letter-spacing="3">IDEAS INTO INTERFACES</text>
<text x="48" y="150" fill="#f1f5ff" font-size="60" font-weight="700" letter-spacing="-2">Krishna Meena</text>
<text x="50" y="208" fill="url(#accent)" font-size="36" font-weight="600">Data. Intelligence. Impact.</text>
<text x="51" y="254" fill="#b8c6e0" font-size="20">Building useful products with AI and data.</text>
<g font-size="14" font-weight="600" letter-spacing="1">
<rect x="50" y="290" width="106" height="34" rx="17" fill="#5eead4" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".35"/>
<text x="72" y="312" fill="#5eead4">GEN AI</text>
<rect x="168" y="290" width="212" height="34" rx="17" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".35"/>
<text x="188" y="312" fill="#7dd3fc">MACHINE LEARNING</text>
<rect x="392" y="290" width="142" height="34" rx="17" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".35"/>
<text x="412" y="312" fill="#c4b5fd">ANALYTICS</text>
</g>
<text x="51" y="371" fill="#8192b5" font-size="14" letter-spacing="1">MSc DATA SCIENCE  /  MUMBAI  /  BUILDING IN PUBLIC</text>
</g>
<rect x="48" y="397" width="1104" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
